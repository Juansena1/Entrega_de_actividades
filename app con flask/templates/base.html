<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CRUD Personas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="{{ url_for('index') }}">CRUD Personas</a>
            <a class="nav-link" href="{{ url_for('crear') }}">＋ Nueva persona</a>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
    <footer class="container footer">Aplicación de ejemplo con Flask, SQLAlchemy y MySQL</footer>
</body>
</html>
