{% extends "base.html" %}
{% block title %}Editar persona | CRUD{% endblock %}
{% block content %}
<section class="form-heading">
    <p class="eyebrow">ACTUALIZAR REGISTRO #{{ person.id }}</p>
    <h1>Editar persona</h1>
    <p class="muted">Modifica la información y guarda los cambios.</p>
</section>
<div class="panel form-panel">
    <form method="POST">
        <label for="name">Nombre completo <span>*</span></label>
        <input id="name" name="name" type="text" maxlength="100" required value="{{ person.name }}">

        <label for="email">Correo electrónico <span>*</span></label>
        <input id="email" name="email" type="email" maxlength="120" required value="{{ person.email }}">

        <label for="phone">Teléfono</label>
        <input id="phone" name="phone" type="text" maxlength="30" value="{{ person.phone or '' }}">

        <div class="form-actions">
            <a class="button secondary" href="{{ url_for('index') }}">Cancelar</a>
            <button class="button primary" type="submit">Guardar cambios</button>
        </div>
    </form>
</div>
{% endblock %}
